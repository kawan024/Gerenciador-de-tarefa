<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #1c1e21;
            --text-sub: #5f6368;
            --bg-problem: #e8f0fe;
            --border-color: #dadce0;
            --input-bg: #ffffff;
            --task-bg: #ffffff;
            --task-hover: rgba(0, 0, 0, 0.02);
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --btn-theme-bg: #f0f2f5;
            --btn-theme-color: #1c1e21;
        }

        /* Variáveis do Tema Escuro */
        body.dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
            --bg-problem: #1a2733;
            --border-color: #333333;
            --input-bg: #2a2a2a;
            --task-bg: #242424;
            --task-hover: #2c2c2c;
            --primary: #3700b3;
            --primary: #478be6;
            --primary-hover: #357ae8;
            --btn-theme-bg: #333333;
            --btn-theme-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.25s, color 0.25s, border-color 0.25s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle-btn {
            background-color: var(--btn-theme-bg);
            color: var(--btn-theme-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle-btn:hover {
            opacity: 0.85;
        }

        .problem-statement {
            font-size: 0.9rem;
            color: var(--text-sub);
            background: var(--bg-problem);
            padding: 12px;
            border-left: 4px solid var(--primary);
            border-radius: 6px;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        #task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        #task-title {
            flex: 1;
            min-width: 200px;
            padding: 12px 14px;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        #task-title:focus {
            border-color: var(--primary);
        }

        #task-priority {
            padding: 12px;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        #task-form button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        #task-form button:hover {
            background-color: var(--primary-hover);
        }

        .list-section h2 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        #task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--task-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .task-item:hover {
            background-color: var(--task-hover);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .task-info input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
        }

        .badge-ALTA { background-color: #d93025; }
        .badge-MÉDIA { background-color: #f2994a; }
        .badge-BAIXA { background-color: #27ae60; }

        .title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .date-text {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-left: auto;
            margin-right: 12px;
        }

        .task-item.completed .title {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .btn-delete {
            background-color: rgba(217, 48, 37, 0.15);
            color: #d93025;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: rgba(217, 48, 37, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>📋 Gerenciador de Tarefas</h1>
                <button id="theme-toggle" class="theme-toggle-btn">
                    <span id="theme-icon">🌙</span> <span id="theme-text">Escuro</span>
                </button>
            </div>
            <p class="problem-statement">
                <strong>Problema resolvido:</strong> Evitar o esquecimento de prazos e organizar pendências do dia a dia por prioridade.
            </p>
        </header>

        <section class="form-section">
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Digite a descrição da tarefa..." required>
                
                <select id="task-priority">
                    <option value="ALTA">Alta Prioridade</option>
                    <option value="MÉDIA" selected>Média Prioridade</option>
                    <option value="BAIXA">Baixa Prioridade</option>
                </select>

                <button type="submit">Adicionar Tarefa</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Sua Lista de Pendências</h2>
            <ul id="task-list"></ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
